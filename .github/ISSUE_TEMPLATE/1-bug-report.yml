name: Bug Report
description: Report a bug in the template
type: Bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Please describe the bug you experienced
      placeholder: What happened? What did you want to happen?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `python --version`, `poetry --version`, and the `common-grants-sdk` version in `poetry.lock`
      placeholder: "Python 3.11.16, Poetry 2.5.1, common-grants-sdk 0.8.1"
    validations:
      required: false
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: Please describe the frequency of the bug
      options:
        - It happened once then I did not try again
        - It happened once then I tried again and everything worked
        - I tried multiple times and saw the bug intermittently
        - I tried multiple times and saw the bug every time
        - None of the above
  - type: textarea
    id: repro_steps
    attributes:
      label: How to reproduce the bug
      description: To see the bug with our own eyes, what steps should we follow?
      placeholder: |
        1. make install
        2. make dev
        3. curl ...
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Where did you see it?
      options:
        - In a fresh copy of the template, before I changed anything
        - In my own project, after I connected my data
        - I do not know
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/common-grants/cg-api-template-fastapi/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
